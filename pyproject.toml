[project]
name = "shelf-life"
version = "0.1.0"
description = "Predicting how long a job posting stays on the board."
readme = "README.md"
# One interpreter, not a range. The artifact is a pickle written under the
# freeze's Python and read by the serving image's, and the Dockerfile, CI, the
# dev container and `.python-version` all name 3.12. Advertising `>=3.11` was a
# promise nothing tested: no 3.11 environment ever ran the suite, and an artifact
# frozen there would meet a 3.12 image with nothing having said it might not
# load. `tests/test_deploy.py` asserts these five places agree.
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Niroj33" }]

# Lower bounds here say what the code needs; `uv.lock` says what it actually
# ran against, hashed, package by package, and is the resolution every
# environment installs — `uv sync --locked` locally, in CI, and in the image.
# For a pickled estimator the distinction is not cosmetic: a booster written
# by one xgboost and read by another is a deploy that fails, or worse, one that
# answers differently from its recorded metrics. The lock's sha256 travels on
# every frozen artifact as `lock_sha256` (`docs/design.md` §16).
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    # Pulled in by scikit-learn anyway, but named because `src/inference` imports
    # it directly to write the model artifact. A dependency you import is a
    # dependency you declare.
    "joblib>=1.4",
]

[project.optional-dependencies]
# Experiment tracking. Optional because MLflow pulls in a large dependency tree
# — a server, a database layer, a web UI — and none of it is needed to run the
# model ladder or the evaluation. `src/models/experiments.py` imports it lazily
# and its tests skip when it is absent.
tracking = [
    "mlflow>=2.16",
]
# Diagnostic figures. Optional for the reason the Dockerfile makes concrete: the
# image installs `.[api]`, so anything in the base dependencies is shipped to a
# 0.1-CPU instance whose cold start already spends 36% of its budget before a
# model loads. A plotting library has no business in the serving image, and
# `src/plots.py` is imported lazily so that nothing in `src/` requires it.
plots = [
    "matplotlib>=3.8",
]
# The HTTP service. Optional for the same reason `tracking` is: the modelling
# code has no need of a web framework, and a stranger who wants to run the
# ladder should not have to install one.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# The UI. Separate from `api` because they deploy separately: the service runs
# in the container, the form can run anywhere that can reach it over HTTP.
ui = [
    "streamlit>=1.36",
    "requests>=2.32",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mlflow>=2.16",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Starlette's TestClient speaks HTTP through httpx rather than through a
    # socket, so the API tests need no network and no running server.
    "httpx>=0.27",
    # Streamlit ships its own test runtime, which renders the script the way
    # `streamlit run` does — so the UI is covered by CI rather than by having
    # been opened in a browser once.
    "streamlit>=1.36",
    "requests>=2.32",
    # `tests/test_deploy.py` parses the deploy workflow and the Space's front
    # matter. MLflow and Streamlit both drag PyYAML in anyway; it is named here
    # because a test imports it, and a dependency you import is a dependency you
    # declare — the alternative is a suite that breaks when an unrelated package
    # drops a transitive dependency.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "api", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
