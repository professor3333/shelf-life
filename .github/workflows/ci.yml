name: CI

# Every push and every pull request. The suite needs no network and no data:
# fixtures are built in code, the API is exercised through an in-process
# transport, and the Streamlit UI is rendered by Streamlit's own test runtime.
# So a green run here means the same thing it means locally.
#
# The environment is the lock, not a fresh resolution. `uv sync --locked`
# installs exactly what `uv.lock` names and refuses if the lock has fallen
# behind `pyproject.toml` — so "add a dependency, forget to re-lock" fails
# here rather than resolving to something newer on the runner than on the
# laptop that froze the model. Same lock, same versions, as the Dockerfile
# installs and as the freeze records in `lock_sha256`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The interpreter comes from `.python-version`, the installer is pinned
      # to the version that wrote the lock — the same two the Dockerfile names.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev --extra api --extra ui

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # The project's own annotations, checked against each other. Third-party
      # scientific libraries ship partial typing, so `ignore_missing_imports`
      # (pyproject) keeps this about our signatures — a wrong return type or a
      # `str` where a `Literal` is declared fails here, `pandas` returning
      # `Any` does not.
      - name: Types
        run: uv run mypy

      # Coverage with a floor, not a target: a change that deletes tests or
      # adds a module nothing exercises fails; the number itself is not a goal.
      # Line and branch, with the per-file table in the job summary and the
      # HTML report as an artifact, so "which paths are untested" is readable
      # without cloning.
      - name: Test
        run: >
          uv run pytest -q --cov --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml --cov-report=html
          --cov-fail-under=85

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Coverage (line + branch)"
            echo
            uv run coverage report --format=markdown --skip-covered --show-missing || true
            echo
            echo "Files at 100% are omitted. The floor is 85%; the HTML report is an artifact of this run."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30

      # The environment that is installed — the same lock the image installs —
      # against the OSV/PyPI advisory databases. A vulnerable pin fails the
      # build on the push that introduced it, not in a release later.
      - name: Audit dependencies
        run: uv run pip-audit --progress-spinner off
