name: CI

# Every push and every pull request. The suite needs no network and no data:
# fixtures are built in code, the API is exercised through an in-process
# transport, and the Streamlit UI is rendered by Streamlit's own test runtime.
# So a green run here means the same thing it means locally.
#
# The environment is the lock, not a fresh resolution. `uv sync --locked`
# installs exactly what `uv.lock` names and refuses if the lock has fallen
# behind `pyproject.toml` — so "add a dependency, forget to re-lock" fails
# here rather than resolving to something newer on the runner than on the
# laptop that froze the model. Same lock, same versions, as the Dockerfile
# installs and as the freeze records in `lock_sha256`.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The interpreter comes from `.python-version`, the installer is pinned
      # to the version that wrote the lock — the same two the Dockerfile names.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra dev --extra api --extra ui

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
