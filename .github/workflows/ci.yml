name: CI

# Every push and every pull request. The suite needs no network and no data:
# fixtures are built in code, the API is exercised through an in-process
# transport, and the Streamlit UI is rendered by Streamlit's own test runtime.
# So a green run here means the same thing it means locally.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,ui]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest -q
