name: CodeQL

# Static analysis of the Python in this repository — the class of finding a
# linter does not look for: injection, unsafe deserialisation, secrets in code,
# resource misuse. Results land under the repository's Security tab. Weekly as
# well as on push, because the query packs update on their own schedule and a
# codebase that has not changed can acquire a finding.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
